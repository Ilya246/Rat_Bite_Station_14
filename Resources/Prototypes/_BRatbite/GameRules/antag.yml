- type: entity
  parent: BaseGameRule
  id: DarkPresenceSpawn
  components:
  - type: StationEvent
    earliestStart: 15
    reoccurrenceDelay: 45
    weight: 5
    minimumPlayers: 20
    duration: 1
    chaos:
      Hostile: 100
    eventType: HostilesSpawn
  - type: GameRule
    chaosScore: 150
  - type: AntagObjectives
    objectives:
    - KillRandomPersonObjectiveDarkPresence
    - KillRandomPersonObjectiveDarkPresence
    - KillRandomPersonObjectiveDarkPresence
  - type: AntagSpawner
    prototype: MobDarkPresenceSelector
  - type: AntagSelection
    agentName: dark-presence-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointDarkPresence
      min: 1
      max: 1
      pickPlayer: false
      mindRoles:
      - MindRoleDarkPresence
  - type: AntagRandomSpawn

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleDarkPresence
  name: dark presence role
  components:
  - type: MindRole
    antagPrototype: DarkPresence
    roleType: SoloAntagonist
    subtype: role-subtype-dark-presence
    exclusiveAntag: true

- type: antag
  id: DarkPresence
  name: roles-antag-dark-presence-name
  antagonist: true
  objective: roles-antag-dark-presence-objective

- type: entity
  parent: BaseKillObjective
  id: KillRandomPersonObjectiveDarkPresence
  description: Kill them.
  components:
  - type: Objective
    difficulty: 2
    issuer: objective-issuer-dark-presence
    unique: false
  - type: TargetObjective
    title: objective-condition-kill-head-title
  - type: PickRandomPerson
  - type: KillPersonCondition
    requireDead: true
